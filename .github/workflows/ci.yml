name: Frontend CI

on:
  push:
    branches: [ main, dev, dev-swapnil ]
  pull_request:
    branches: [ main, dev, dev-swapnil ]

jobs:
  build:
    name: Build & Typecheck (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build
